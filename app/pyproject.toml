[project]
name = "stem-splitter"
version = "0.1.0"
description = "Separação de áudio em pistas usando o Demucs instalado no computador"
requires-python = ">=3.9"
dependencies = ["webui2==2.5.8"]

[dependency-groups]
dev = ["pyinstaller>=6"]

[project.scripts]
stem-splitter = "stem_splitter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stem_splitter"]
