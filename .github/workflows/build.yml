name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: glibc mais antigo, o pacote roda em mais distribuições
          - { name: linux-x64, os: ubuntu-22.04, ext: tar.gz }
          - { name: windows-x64, os: windows-latest, ext: zip }
          - { name: macos-arm64, os: macos-14, ext: zip }
          - { name: macos-x64, os: macos-15-intel, ext: zip }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Compilar a interface (React)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Instalar dependências Python
        working-directory: app
        run: uv sync --frozen

      - name: Empacotar (PyInstaller)
        working-directory: app
        run: uv run pyinstaller --noconfirm --distpath ../dist --workpath ../build demucs-splitter-gui.spec

      - name: Auto-teste do pacote (interface + biblioteca do WebUI)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/demucs-splitter-gui/demucs-splitter-gui.exe; else exe=dist/demucs-splitter-gui/demucs-splitter-gui; fi
          "$exe" --self-test

      - name: Compactar
        run: |
          name="demucs-splitter-gui-${{ matrix.name }}"
          case "$RUNNER_OS" in
            Linux)   tar -czf "$name.tar.gz" -C dist demucs-splitter-gui ;;
            macOS)   ditto -c -k --keepParent dist/demucs-splitter-gui "$name.zip" ;;  # preserva permissões de execução
            Windows) 7z a -tzip "$name.zip" ./dist/demucs-splitter-gui > /dev/null ;;
          esac
          ls -lh "$name".*

      - uses: actions/upload-artifact@v4
        with:
          name: demucs-splitter-gui-${{ matrix.name }}
          path: demucs-splitter-gui-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
